name: stegoland
description: "Stegoland - taman permainan indoor & Jasmine Cafe, Pasir Tumboh, Kelantan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0F2C7E"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#0F2C7E"
    theme_color: "#0F2C7E"

flutter_native_splash:
  color: "#0F2C7E"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0F2C7E"
    image: assets/images/app_icon_foreground.png
  web: true
